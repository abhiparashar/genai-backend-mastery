# The full hybrid stack: Java gateway + Python AI service + Redis + pgvector.
#
#   docker compose up --build
#   curl -X POST localhost:8080/api/chat \
#     -H 'Content-Type: application/json' -H 'X-Correlation-ID: demo-1' \
#     -d '{"messages":[{"role":"user","content":"hello"}]}'
#
# Runs with no API keys: the Python service defaults to its offline provider.

services:
  gateway:
    build:
      context: ./spring-ai-gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: dev-key-1
      # 35s > the Python service's 30s LLM timeout. See the README.
      AI_SERVICE_TIMEOUT: "35"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    # The module 06 service. Hostname must stay `ai-service`: the gateway
    # resolves it by name on this network.
    build:
      context: ../06-production-service
    container_name: ai-service
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_KEYS: dev-key-1
      LOG_FORMAT: json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: genai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
